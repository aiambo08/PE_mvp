[project]
name = "pe-deal-sourcing-mvp"
version = "0.3.0"
description = "Private Equity Deal Sourcing & Financial Due Diligence RAG Platform"
readme = "README.md"
authors = [
    { name = "Aibo", email = "aibo.ni@alumnos.upm.es" }
]
requires-python = ">=3.11.0"
dependencies = [
    "aiofiles>=23.2.0",
    "beautifulsoup4==4.12.3",
    "fastapi==0.110.0",
    "httpx==0.27.0",
    "instructor==1.1.0",
    "llama-index==0.10.19",
    "llama-index-embeddings-huggingface>=0.1.4",
    "llama-index-vector-stores-qdrant==0.1.5",
    "openai==1.14.1",
    "pandas==2.2.1",
    "pdfplumber>=0.11.0",
    "playwright==1.42.0",
    "pydantic==2.7.0",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    "python-multipart>=0.0.9",
    "qdrant-client==1.8.0",
    "requests==2.31.0",
    "streamlit==1.32.2",
    "uvicorn[standard]==0.28.0",
    "weasyprint>=60.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
