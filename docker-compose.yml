

services:
    qdrant:
        image: qdrant/qdrant:latest
        container_name: pe_qdrant_db
        ports:
            - "6333:6333"
            - "6334:6334"
        volumes:
            - qdrant_storage:/qdrant/qdrant_storage
        restart: always
        environment:
            - QDRANT__SERVICE__HTTP_PORT=6333

    api:
        build: .
        container_name: pe_fastapi_app
        ports:
            - "8000:8000"
        volumes:
            - .:/app
            - ./data:/app/data
        env_file: 
            - .env
        depends_on:
            - qdrant
        restart: unless-stopped
    
    ui:
        build: .
        container_name: pe_streamlit_ui
        command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
        ports:
            - "8501:8501"
        volumes:
            - .:/app
            - ./data:/app/data
        environment:
            - API_BASE_URL=http://api:8000/api/v1
        env_file:
            - .env
        depends_on:
            - api
        restart: unless-stopped

volumes:
    qdrant_storage:
        driver: local
            