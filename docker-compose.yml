

services:
    qdrant:
        image: qdrant/qdrant:latest
        container_name: pe_qdrant_db
        ports:
            - "6333:6333"
            - "6334:6334"
        volumes:
            - qdrant_storage:/qdrant/qdrant_storage
        restart: always
        environment:
            - QDRANT__SERVICE__HTTP_PORT=6333

    api:
        build: .
        container_name: pe_fastapi_app
        ports:
            - "8000:8000"
        volumes:
            - .:/app
            - ./data:/app/data
        env_file: 
            - .env
        depends_on:
            - qdrant
        restart: unless-stopped
volumes:
    qdrant_storage:
        driver: local
            